<mat-toolbar color="primary" class="header">
  <div class="container header-container">
    <div class="logo-container">
      <a [routerLink]="['/dashboard']" class="logo">
        <mat-icon>lock</mat-icon>
        <span>Vault</span>
      </a>
    </div>

    <div class="nav-links" [class.show-mobile-menu]="showMobileMenu">
      <a mat-button 
        routerLink="/dashboard" 
        routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-button 
        routerLink="/passwords" 
        routerLinkActive="active-link">
        <mat-icon>vpn_key</mat-icon>
        <span>Passwords</span>
      </a>
      <a mat-button 
        routerLink="/generator" 
        routerLinkActive="active-link">
        <mat-icon>shuffle</mat-icon>
        <span>Generator</span>
      </a>
      <a mat-button 
        routerLink="/settings" 
        routerLinkActive="active-link">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </a>
    </div>

    <div class="user-section" *ngIf="isLoggedIn()">
      <div class="user-info" *ngIf="!isDemoMode()">
        <img 
          *ngIf="userPhotoUrl()" 
          [src]="userPhotoUrl()" 
          [alt]="userDisplayName()"
          class="user-avatar">
        <div class="user-details">
          <span class="user-name">{{ userDisplayName() }}</span>
          <span class="user-email">{{ userEmail() }}</span>
        </div>
      </div>
      
      <div class="demo-info" *ngIf="isDemoMode()">
        <mat-icon class="demo-icon">visibility</mat-icon>
        <div class="demo-details">
          <span class="demo-name">Demo Mode</span>
          <span class="demo-subtitle">Try the app without login</span>
        </div>
      </div>
      
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon>more_vert</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu">
        <div class="menu-header" *ngIf="!isDemoMode()">
          <div class="menu-user-info">
            <img 
              *ngIf="userPhotoUrl()" 
              [src]="userPhotoUrl()" 
              [alt]="userDisplayName()"
              class="menu-avatar">
            <div>
              <div class="menu-user-name">{{ userDisplayName() }}</div>
              <div class="menu-user-email">{{ userEmail() }}</div>
            </div>
          </div>
        </div>
        
        <div class="menu-header" *ngIf="isDemoMode()">
          <div class="menu-demo-info">
            <mat-icon class="menu-demo-icon">visibility</mat-icon>
            <div>
              <div class="menu-demo-name">Demo Mode</div>
              <div class="menu-demo-subtitle">Try the app without login</div>
            </div>
          </div>
        </div>
        
        <mat-divider></mat-divider>
        
        <button mat-menu-item (click)="logout()" *ngIf="!isDemoMode()">
          <mat-icon>logout</mat-icon>
          <span>Sign Out</span>
        </button>
        
        <button mat-menu-item (click)="exitDemo()" *ngIf="isDemoMode()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Exit Demo</span>
        </button>
      </mat-menu>
    </div>

    <button mat-icon-button class="menu-button" (click)="toggleMobileMenu()">
      <mat-icon>{{ showMobileMenu ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>
